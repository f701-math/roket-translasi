<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Petualangan Roket Translasi by Fauzul</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Mencegah scroll pada layar HP */
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      background: #1e293b;
    }

    /* Header & Stats */
    .header {
      background: #334155;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid #475569;
    }

    .title-group h1 {
      font-size: 1.1rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-badge {
      font-size: 0.85rem;
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 20px;
      color: #fbbf24;
      font-weight: bold;
      border: 1px solid #64748b;
    }

    /* Coords Display */
    .coords-bar {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }

    .coord-box {
      flex: 1;
      background: #334155;
      padding: 6px 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #475569;
    }

    .coord-box.rocket { color: #38bdf8; }
    .coord-box.moon { color: #facc15; }

    /* Canvas Area */
    .canvas-container {
      flex: 1;
      position: relative;
      background: #090d16;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0; /* Penting untuk flex layout di HP */
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Controls Section */
    .controls-panel {
      background: #334155;
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #475569;
    }

    .panel-title {
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-option {
      background: linear-gradient(180deg, #2563eb, #1d4ed8);
      border: 2px solid #60a5fa;
      color: white;
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .btn-option:active {
      transform: scale(0.95);
      background: #1e40af;
    }

    .btn-option .sub-label {
      font-size: 0.65rem;
      color: #bfdbfe;
      font-weight: normal;
    }

    .btn-option:disabled {
      background: #475569;
      border-color: #64748b;
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal Overlay */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 10;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .modal p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 16px; line-height: 1.4; }
    .modal-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <div class="title-group">
      <h1>🚀 LEVEL <span id="lvl-display">1</span></h1>
    </div>
    <div class="step-badge">
      LANGKAH: <span id="step-display">0</span>/<span id="max-step-display">10</span>
    </div>
  </div>

  <!-- Coordinates -->
  <div class="coords-bar">
    <div class="coord-box rocket">🚀 Roket: <span id="rocket-coord">(0,0)</span></div>
    <div class="coord-box moon">🌕 Bulan: <span id="moon-coord">(0,0)</span></div>
  </div>

  <!-- Game Canvas -->
  <div class="canvas-container" id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Modal Result -->
    <div class="modal" id="gameModal">
      <div class="modal-content">
        <h2 id="modal-title">MENANG!</h2>
        <p id="modal-msg">Roket berhasil mendarat di Bulan!</p>
        <button class="modal-btn" onclick="nextAction()">Lanjut</button>
      </div>
    </div>
  </div>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <div class="panel-title">PILIH NOTASI TRANSLASI [X, Y]</div>
    <div class="options-grid">
      <button class="btn-option" id="opt-0" onclick="makeMove(0)">
        <span id="label-0">[0, 0]</span>
        <span class="sub-label">Pilihan 1</span>
      </button>
      <button class="btn-option" id="opt-1" onclick="makeMove(1)">
        <span id="label-1">[0, 0]</span>
        <span class="sub-label">Pilihan 2</span>
      </button>
      <button class="btn-option" id="opt-2" onclick="makeMove(2)">
        <span id="label-2">[0, 0]</span>
        <span class="sub-label">Pilihan 3</span>
      </button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('canvas-wrapper');

  // Game State Variables
  const GRID_SIZE = 10;
  let level = 1;
  let stepsLeft = 10;
  let maxSteps = 10;
  let movesCount = 0;
  let isAnimating = false;

  let rocket = { x: 0, y: 0 };
  let moon = { x: 0, y: 0 };
  let currentOptions = [];
  let currentHoverOpt = null;

  // Responsiveness Adjustment
  function resizeCanvas() {
    const rect = wrapper.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    draw();
  }
  window.addEventListener('resize', resizeCanvas);

  function initLevel() {
    isAnimating = false;
    movesCount = 0;

    // Grid bounds: 0 to 10
    // Generate Random Start Positions
    rocket.x = Math.floor(Math.random() * 4) + 1; // 1..4
    rocket.y = Math.floor(Math.random() * 4) + 1; // 1..4

    moon.x = Math.floor(Math.random() * 4) + 6; // 6..9
    moon.y = Math.floor(Math.random() * 4) + 6; // 6..9

    maxSteps = Math.max(8, 12 - Math.floor(level / 2));
    stepsLeft = maxSteps;

    updateUI();
    generateOptions();
    resizeCanvas();
  }

  function updateUI() {
    document.getElementById('lvl-display').innerText = level;
    document.getElementById('step-display').innerText = movesCount;
    document.getElementById('max-step-display').innerText = maxSteps;
    document.getElementById('rocket-coord').innerText = `(${rocket.x}, ${rocket.y})`;
    document.getElementById('moon-coord').innerText = `(${moon.x}, ${moon.y})`;
  }

  function generateOptions() {
    currentOptions = [];
    movesCount++;
    document.getElementById('step-display').innerText = movesCount;

    // Distance to Moon
    const dx = moon.x - rocket.x;
    const dy = moon.y - rocket.y;

    // After 5 steps (on step 6 onwards), guarantee at least 1 winning option
    let winningIndex = -1;
    if (movesCount >= 6) {
      winningIndex = Math.floor(Math.random() * 3);
    }

    for (let i = 0; i < 3; i++) {
      if (i === winningIndex) {
        currentOptions.push([dx, dy]);
      } else {
        let rx = Math.floor(Math.random() * 9) - 4; // -4 to 4
        let ry = Math.floor(Math.random() * 9) - 4; // -4 to 4
        // Avoid duplicate winning vector prematurely
        if (rx === dx && ry === dy && winningIndex === -1) {
          rx += 1;
        }
        currentOptions.push([rx, ry]);
      }
    }

    // Render option buttons
    for (let i = 0; i < 3; i++) {
      const [x, y] = currentOptions[i];
      const signX = x >= 0 ? `+${x}` : `${x}`;
      const signY = y >= 0 ? `+${y}` : `${y}`;
      document.getElementById(`label-${i}`).innerText = `[${signX}, ${signY}]`;
      document.getElementById(`opt-${i}`).disabled = false;
    }
  }

  function makeMove(index) {
    if (isAnimating) return;
    isAnimating = true;

    // Disable all option buttons during animation
    for (let i = 0; i < 3; i++) {
      document.getElementById(`opt-${i}`).disabled = true;
    }

    const [tx, ty] = currentOptions[index];
    const targetX = rocket.x + tx;
    const targetY = rocket.y + ty;

    // Animate movement horizontally first (L-shape), then vertically
    let startX = rocket.x;
    let startY = rocket.y;
    let duration = 600; // ms
    let startTime = null;

    function stepAnimation(timestamp) {
      if (!startTime) startTime = timestamp;
      let progress = (timestamp - startTime) / duration;

      if (progress > 1) progress = 1;

      // First half: Move X, Second half: Move Y
      if (progress < 0.5) {
        let p1 = progress * 2;
        rocket.x = startX + tx * p1;
        rocket.y = startY;
      } else {
        let p2 = (progress - 0.5) * 2;
        rocket.x = startX + tx;
        rocket.y = startY + ty * p2;
      }

      draw();

      if (progress < 1) {
        requestAnimationFrame(stepAnimation);
      } else {
        // Round position to integer
        rocket.x = targetX;
        rocket.y = targetY;
        updateUI();

        // Check Win/Loss conditions
        checkGameStatus();
      }
    }

    requestAnimationFrame(stepAnimation);
  }

  function checkGameStatus() {
    // 1. Out of Bounds Check
    if (rocket.x < 0 || rocket.x > GRID_SIZE || rocket.y < 0 || rocket.y > GRID_SIZE) {
      showModal(false, "Roket keluar dari batas area permainan!");
      return;
    }

    // 2. Win Check
    if (rocket.x === moon.x && rocket.y === moon.y) {
      showModal(true, "Luar biasa! Roket mendarat tepat di Bulan!");
      return;
    }

    // 3. Max Steps Reached Check
    if (movesCount >= maxSteps) {
      showModal(false, "Kehabisan langkah! Roket gagal mencapai Bulan.");
      return;
    }

    // Next step
    isAnimating = false;
    generateOptions();
    draw();
  }

  function showModal(isWin, message) {
    const modal = document.getElementById('gameModal');
    const title = document.getElementById('modal-title');
    const msg = document.getElementById('modal-msg');

    if (isWin) {
      title.innerText = "🎉 MENANG!";
      title.style.color = "#4ade80";
      msg.innerText = message + ` Naik ke Level ${level + 1}!`;
      level++;
    } else {
      title.innerText = "💥 GAGAL!";
      title.style.color = "#f87171";
      let prevLvl = level;
      level = Math.max(1, level - 1);
      msg.innerText = message + (prevLvl > 1 ? ` Turun ke Level ${level}.` : "");
    }

    modal.style.display = "flex";
  }

  function nextAction() {
    document.getElementById('gameModal').style.display = "none";
    initLevel();
  }

  /* Drawing Logic */
  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    const padding = 28;

    const netW = w - padding * 2;
    const netH = h - padding * 2;
    const stepX = netW / GRID_SIZE;
    const stepY = netH / GRID_SIZE;

    // Helper: Coordinate conversion (Origin 0,0 at bottom-left)
    function toCanvasX(gridX) { return padding + gridX * stepX; }
    function toCanvasY(gridY) { return h - padding - gridY * stepY; }

    // Clear Background
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, w, h);

    // Draw Grid Lines & Numbers
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#1e293b";
    ctx.fillStyle = "#94a3b8";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (let i = 0; i <= GRID_SIZE; i++) {
      let x = toCanvasX(i);
      let y = toCanvasY(i);

      // Grid line X
      ctx.beginPath();
      ctx.strokeStyle = "#334155";
      ctx.moveTo(x, padding);
      ctx.lineTo(x, h - padding);
      ctx.stroke();

      // Grid line Y
      ctx.beginPath();
      ctx.moveTo(padding, y);
      ctx.lineTo(w - padding, y);
      ctx.stroke();

      // Axis Numbers
      ctx.fillText(i, x, h - 12);
      ctx.fillText(i, 12, y);
    }

    // Draw Red Boundary Box
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2;
    ctx.strokeRect(padding, padding, netW, netH);

    // Draw Moon
    const moonCX = toCanvasX(moon.x);
    const moonCY = toCanvasY(moon.y);
    ctx.fillStyle = "#facc15";
    ctx.shadowColor = "#facc15";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(moonCX, moonCY, Math.min(stepX, stepY) * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Moon craters
    ctx.fillStyle = "#eab308";
    ctx.beginPath();
    ctx.arc(moonCX - 3, moonCY - 3, 3, 0, Math.PI * 2);
    ctx.arc(moonCX + 4, moonCY + 2, 2, 0, Math.PI * 2);
    ctx.fill();

    // Draw Rocket
    const rocketCX = toCanvasX(rocket.x);
    const rocketCY = toCanvasY(rocket.y);
    const rSize = Math.min(stepX, stepY) * 0.3;

    ctx.save();
    ctx.translate(rocketCX, rocketCY);

    // Body
    ctx.fillStyle = "#38bdf8";
    ctx.shadowColor = "#38bdf8";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(0, 0, rSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Fins
    ctx.fillStyle = "#f43f5e";
    ctx.fillRect(-rSize * 0.4, -rSize * 0.4, rSize * 0.8, rSize * 0.8);

    ctx.restore();
  }

  // Initial Start
  initLevel();
</script>

</body>
</html>
